[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-seats"
version = "8.1.3"
description = "Deterministic, budget-aware supervision for isolated Codex seats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.scripts]
codex-seat = "codex_seats.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.3.0,<2",
    "pytest==9.1.1",
    "ruff==0.15.21",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
]

[tool.setuptools]
packages = ["codex_seats"]
package-dir = { codex_seats = "lib/codex_seats" }

[tool.ruff.lint.per-file-ignores]
# workers.py deliberately re-exports imported names and has a late import that
# breaks an import cycle. Autofixing either rule would break that facade.
"lib/codex_seats/workers.py" = ["F401", "E402"]
