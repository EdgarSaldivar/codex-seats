name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and development gates
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Enforce subprocess policy
        run: python scripts/check_subprocess_policy.py
      - name: Enforce tracked-file policy
        run: python scripts/check_tracked_files.py
      - name: Scan tracked files for likely secrets
        run: python scripts/check_likely_secrets.py

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling from project metadata
        run: python -m pip install ".[dev]"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          test "$("$RUNNER_TEMP/wheel-venv/bin/codex-seat" --version)" = "codex-seat 8.1.3"
      - name: Verify installed default review gate
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from unittest import mock

          from codex_seats import goalspec

          spec = mock.Mock(review="", review_model="")
          assert goalspec.resolve_review_command(spec) == ""
          command = goalspec.resolve_review_command(spec, mode="blocking")
          assert goalspec.REVIEW_GATE.is_file(), goalspec.REVIEW_GATE
          assert goalspec.REVIEW_GATE.parent.name == "codex_seats", goalspec.REVIEW_GATE
          assert str(goalspec.REVIEW_GATE) in command, command
          PY

  native-macos:
    name: macOS native sandbox acceptance
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CI: "1"
      OPENAI_API_KEY: ""
      CODEX_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install ".[dev]"
      - name: Install and verify native Codex CLI
        run: |
          npm install --global @openai/codex@0.153.1
          test "$(codex --version)" = "codex-cli 0.153.1"
      - name: Run native sandbox fixture without credentials or prompts
        run: |
          python tests/native_sandbox_fixture.py > "$RUNNER_TEMP/native-sandbox.json"
          python - "$RUNNER_TEMP/native-sandbox.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["status"] == "completed", result["status"]
          assert result["approval_prompts"] == 0, result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
